<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio form blueprint</title>
  </head>
  <body>
    <form name="portfolio-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="portfolio-contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="subject" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
